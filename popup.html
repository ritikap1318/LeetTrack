<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Revisor</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 15px;
      background-color: #f9f9f9;
      margin: 0;
    }
    h3 {
      color: #333;
      margin-top: 0;
      text-align: center;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #ffa116; /* LeetCode's official orange color */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #e58f12;
    }
    #status {
      color: #28a745;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>
  <h3>LeetCode Spaced Revisor</h3>
  <input type="text" id="problemUrl" placeholder="Paste LeetCode problem URL..." />
  <button id="remindBtn">Set 1-3-7 Reminders</button>
  <p id="status">Reminders successfully set!</p>

  <script src="popup.js"></script>
</body>
</html>
